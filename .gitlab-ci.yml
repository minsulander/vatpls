build:
  image: node:20-slim
  script:
    - cd web
    - npm install
    - npm run build
  artifacts:
    paths:
      - web/dist
    expire_in: 1 week
  cache:
    key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    paths:
      - web/node_modules

test:
  image: node:20-slim
  script:
    - cd web
    - npm install
    - npx vitest run --reporter=junit --outputFile=./test-result.xml
  artifacts:
    reports:
      junit:
        - web/test-result.xml
  cache:
    key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    paths:
      - web/node_modules
